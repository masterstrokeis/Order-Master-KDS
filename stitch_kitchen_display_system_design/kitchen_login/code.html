<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>La Botica - Kitchen Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ffb4ab",
                        "background": "#0b1326",
                        "on-error": "#690005",
                        "secondary-fixed": "#ffdad7",
                        "surface-container-highest": "#2d3449",
                        "on-error-container": "#ffdad6",
                        "surface-container": "#171f33",
                        "surface": "#0b1326",
                        "on-background": "#dae2fd",
                        "on-primary-fixed-variant": "#005236",
                        "on-surface-variant": "#bbcabf",
                        "on-tertiary": "#650911",
                        "on-tertiary-fixed-variant": "#842225",
                        "on-primary-fixed": "#002113",
                        "error-container": "#93000a",
                        "on-surface": "#dae2fd",
                        "outline": "#86948a",
                        "inverse-on-surface": "#283044",
                        "surface-dim": "#0b1326",
                        "inverse-surface": "#dae2fd",
                        "surface-container-low": "#131b2e",
                        "on-primary-container": "#00422b",
                        "surface-tint": "#4edea3",
                        "tertiary": "#ffb3af",
                        "secondary": "#ffb3ad",
                        "on-secondary-fixed": "#410004",
                        "surface-bright": "#31394d",
                        "primary": "#4edea3",
                        "tertiary-fixed": "#ffdad7",
                        "surface-container-high": "#222a3d",
                        "on-tertiary-container": "#711419",
                        "secondary-container": "#a40217",
                        "tertiary-fixed-dim": "#ffb3af",
                        "on-secondary-container": "#ffaea8",
                        "secondary-fixed-dim": "#ffb3ad",
                        "inverse-primary": "#006c49",
                        "on-secondary-fixed-variant": "#930013",
                        "primary-fixed": "#6ffbbe",
                        "surface-variant": "#2d3449",
                        "on-primary": "#003824",
                        "outline-variant": "#3c4a42",
                        "surface-container-lowest": "#060e20",
                        "tertiary-container": "#fc7c78",
                        "primary-fixed-dim": "#4edea3",
                        "on-tertiary-fixed": "#410005",
                        "primary-container": "#10b981",
                        "on-secondary": "#68000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "card-padding": "20px",
                        "margin-page": "24px",
                        "touch-target-min": "48px",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "display-timer": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-caps": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "display-timer": ["48px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "500"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-caps": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Keypad active state scaling */
        .keypad-btn:active {
            transform: scale(0.95);
        }

        /* PIN dots animation */
        .pin-dot {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pin-dot.filled {
            background-color: #4edea3;
            box-shadow: 0 0 12px rgba(78, 222, 163, 0.4);
        }

        /* Glassmorphism subtle overlay */
        .glass-overlay {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0) 100%);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-gutter font-body-md">
<!-- Background Pattern -->
<div class="fixed inset-0 pointer-events-none opacity-20 overflow-hidden">
<div class="absolute -top-1/4 -left-1/4 w-[150%] h-[150%] bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-surface-container-high via-transparent to-transparent"></div>
</div>
<!-- Login Card Container -->
<main class="relative z-10 w-full max-w-[500px] bg-surface-container-low border border-outline-variant rounded-xl shadow-2xl overflow-hidden glass-overlay">
<!-- Header / Logo Section -->
<div class="p-card-padding text-center border-b border-outline-variant">
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">La Botica</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant mt-1">Kitchen Display System 2.4</p>
</div>
<div class="p-card-padding flex flex-col gap-unit-6 space-y-6">
<!-- Staff Selection -->
<div class="space-y-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-1">Staff Member</label>
<div class="relative group">
<select class="w-full h-touch-target-min bg-surface-container-high border border-outline-variant rounded-lg px-4 font-body-lg text-body-lg appearance-none cursor-pointer focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" id="staff-select">
<option disabled="" selected="" value="">Select Name</option>
<option value="maria">Chef Maria</option>
<option value="john">Line Cook John</option>
<option value="sarah">Sous Chef Sarah</option>
</select>
<div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- PIN Entry Visuals -->
<div class="flex flex-col items-center gap-4">
<div class="flex gap-4" id="pin-container">
<div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant"></div>
<div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant"></div>
<div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant"></div>
<div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant"></div>
</div>
</div>
<!-- Numeric Keypad -->
<div class="grid grid-cols-3 gap-3">
<button class="keypad-btn h-16 bg-surface-container-highest rounded-lg flex items-center justify-center font-headline-md text-headline-md hover:bg-surface-bright transition-colors" onclick="appendPin('1')">1</button>
<button class="keypad-btn h-16 bg-surface-container-highest rounded-lg flex items-center justify-center font-headline-md text-headline-md hover:bg-surface-bright transition-colors" onclick="appendPin('2')">2</button>
<button class="keypad-btn h-16 bg-surface-container-highest rounded-lg flex items-center justify-center font-headline-md text-headline-md hover:bg-surface-bright transition-colors" onclick="appendPin('3')">3</button>
<button class="keypad-btn h-16 bg-surface-container-highest rounded-lg flex items-center justify-center font-headline-md text-headline-md hover:bg-surface-bright transition-colors" onclick="appendPin('4')">4</button>
<button class="keypad-btn h-16 bg-surface-container-highest rounded-lg flex items-center justify-center font-headline-md text-headline-md hover:bg-surface-bright transition-colors" onclick="appendPin('5')">5</button>
<button class="keypad-btn h-16 bg-surface-container-highest rounded-lg flex items-center justify-center font-headline-md text-headline-md hover:bg-surface-bright transition-colors" onclick="appendPin('6')">6</button>
<button class="keypad-btn h-16 bg-surface-container-highest rounded-lg flex items-center justify-center font-headline-md text-headline-md hover:bg-surface-bright transition-colors" onclick="appendPin('7')">7</button>
<button class="keypad-btn h-16 bg-surface-container-highest rounded-lg flex items-center justify-center font-headline-md text-headline-md hover:bg-surface-bright transition-colors" onclick="appendPin('8')">8</button>
<button class="keypad-btn h-16 bg-surface-container-highest rounded-lg flex items-center justify-center font-headline-md text-headline-md hover:bg-surface-bright transition-colors" onclick="appendPin('9')">9</button>
<button class="keypad-btn h-16 bg-surface-container-highest text-error rounded-lg flex items-center justify-center font-label-caps text-label-caps hover:bg-error-container/20 transition-colors" onclick="clearPin()">CLEAR</button>
<button class="keypad-btn h-16 bg-surface-container-highest rounded-lg flex items-center justify-center font-headline-md text-headline-md hover:bg-surface-bright transition-colors" onclick="appendPin('0')">0</button>
<button class="keypad-btn h-16 bg-surface-container-highest rounded-lg flex items-center justify-center hover:bg-surface-bright transition-colors" onclick="backspace()">
<span class="material-symbols-outlined">backspace</span>
</button>
</div>
<!-- Login Action -->
<button class="w-full h-touch-target-min bg-primary-container text-on-primary-container font-headline-md text-headline-md rounded-lg mt-4 active:scale-95 transition-transform shadow-lg shadow-primary-container/20 flex items-center justify-center gap-2" id="login-btn">
<span class="material-symbols-outlined">login</span>
                Login
            </button>
</div>
<!-- Footer Help -->
<div class="p-card-padding flex justify-center border-t border-outline-variant bg-surface-container-lowest">
<button class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-sm">help</span>
<span class="font-label-caps text-label-caps">Technical Support</span>
</button>
</div>
</main>
<script>
        let pin = "";
        const maxPinLength = 4;
        const dots = document.querySelectorAll('.pin-dot');
        const loginBtn = document.getElementById('login-btn');
        const staffSelect = document.getElementById('staff-select');

        function updateDots() {
            dots.forEach((dot, index) => {
                if (index < pin.length) {
                    dot.classList.add('filled', 'border-primary');
                    dot.classList.remove('border-outline-variant');
                } else {
                    dot.classList.remove('filled', 'border-primary');
                    dot.classList.add('border-outline-variant');
                }
            });
        }

        function appendPin(digit) {
            if (pin.length < maxPinLength) {
                pin += digit;
                updateDots();
                
                // Haptic feedback simulation
                if ('vibrate' in navigator) {
                    navigator.vibrate(20);
                }
            }
        }

        function clearPin() {
            pin = "";
            updateDots();
        }

        function backspace() {
            pin = pin.slice(0, -1);
            updateDots();
        }

        loginBtn.addEventListener('click', () => {
            if (!staffSelect.value) {
                alert('Please select a staff member first.');
                return;
            }
            if (pin.length < maxPinLength) {
                alert('Please enter your full 4-digit PIN.');
                return;
            }

            // Simple success visual feedback
            loginBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Accessing...';
            loginBtn.classList.add('opacity-80');
            
            setTimeout(() => {
                loginBtn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Welcome';
                loginBtn.classList.replace('bg-primary-container', 'bg-primary');
                // Redirect logic would go here
            }, 800);
        });

        // Keypad keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                appendPin(e.key);
            } else if (e.key === 'Backspace') {
                backspace();
            } else if (e.key === 'Escape') {
                clearPin();
            } else if (e.key === 'Enter') {
                loginBtn.click();
            }
        });
    </script>
</body></html>
